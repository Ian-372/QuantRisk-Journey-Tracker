<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quantitative Risk & Financial Analytics career journey tracker">
  <title>Gideon Juma — Quantitative Risk Journey</title>
  <link rel="stylesheet" href="css/styles.css?v=8">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">QR</div>
        <div><strong>Gideon Juma</strong><span>Career Journey</span></div>
      </div>
      <nav>
        <button class="nav-item active" data-view="dashboard" title="Dashboard"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></button>
        <button class="nav-item" data-view="roadmap" title="Roadmap"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v4H5zM5 10h9v4H5zM5 16h14v4H5zM19 12h2"/></svg><span>Roadmap</span></button>
        <button class="nav-item" data-view="skills" title="Skills Matrix"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Skills Matrix</span></button>
        <button class="nav-item" data-view="projects" title="Projects"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/><path d="M3 10h18"/></svg><span>Projects</span></button>
        <button class="nav-item" data-view="interview" title="Interview Lab"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m9 12 2 2 4-5"/></svg><span>Interview Lab</span></button>
        <button class="nav-item" data-view="evidence" title="Evidence"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg><span>Evidence</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="goal-card">
          <small>GRADUATION TARGET</small>
          <b>Becoming job-ready</b>
          <span>Quantitative Risk & Financial Analytics</span>
        </div>
        <button class="nav-item" data-view="settings" title="Settings"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="m19 13 2-1-2-1-.5-2 1-2-2-1-1.5 1.2-2-.8L13 5l-1-2-1 2-2 .4L7.5 4 6 5l1 2-.5 2-2 1 2 1 .5 2-1 2 1.5 1 1.5-1.2 2 .8 1 2 1-2 2-.4 1.5 1.2 1.5-1-1-2z"/></svg><span>Settings</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">GIDEON JUMA · YEAR 3.1 → GRADUATION</p>
          <h1 id="pageTitle">Becoming a Quantitative Risk Professional</h1>
        </div>
        <div class="top-actions">
          <div class="streak"><span>🔥</span><b id="streakValue">0</b><small>day streak</small></div>
          <button class="icon-btn" id="themeBtn" title="Toggle theme">☾</button>
        </div>
      </header>

      <section id="dashboardView" class="view active"></section>
      <section id="roadmapView" class="view"></section>
      <section id="skillsView" class="view"></section>
      <section id="projectsView" class="view"></section>
      <section id="interviewView" class="view"></section>
      <section id="evidenceView" class="view"></section>
      <section id="settingsView" class="view"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <script src="data/roadmap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quantitative Risk & Financial Analytics career journey tracker">
  <title>QuantRisk Journey — Career Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">QR</div>
        <div><strong>QuantRisk</strong><span>Journey Tracker</span></div>
      </div>
      <nav>
        <button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav-item" data-view="roadmap">◎ <span>Roadmap</span></button>
        <button class="nav-item" data-view="skills">◈ <span>Skills Matrix</span></button>
        <button class="nav-item" data-view="projects">▣ <span>Projects</span></button>
        <button class="nav-item" data-view="interview">◉ <span>Interview Lab</span></button>
        <button class="nav-item" data-view="evidence">✓ <span>Evidence</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="goal-card">
          <small>GRADUATION TARGET</small>
          <b>Job-ready by Year 4</b>
          <span>Quantitative Risk & Financial Analytics</span>
        </div>
        <button class="nav-item" data-view="settings">⚙ <span>Settings</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">YEAR 3.1 → GRADUATION</p>
          <h1 id="pageTitle">Career Dashboard</h1>
        </div>
        <div class="top-actions">
          <div class="streak"><span>🔥</span><b id="streakValue">0</b><small>day streak</small></div>
          <button class="icon-btn" id="themeBtn" title="Toggle theme">☾</button>
        </div>
      </header>

      <section id="dashboardView" class="view active"></section>
      <section id="roadmapView" class="view"></section>
      <section id="skillsView" class="view"></section>
      <section id="projectsView" class="view"></section>
      <section id="interviewView" class="view"></section>
      <section id="evidenceView" class="view"></section>
      <section id="settingsView" class="view"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <script src="data/roadmap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
